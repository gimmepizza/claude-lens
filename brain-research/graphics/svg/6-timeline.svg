<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 530" role="img" aria-label="Timeline of neural innovations, oldest to most recent" xmlns="http://www.w3.org/2000/svg" ><rect x="0" y="0" width="880" height="530" fill="#fcfcfb"/><line x1="150" y1="24" x2="150" y2="477" class="axisline"></line><text x="150" y="16" text-anchor="middle" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">older ↑</text><text x="150" y="522" text-anchor="middle" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">↓ more recent</text><text x="132" y="49" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~600 Mya</text><circle cx="150" cy="45" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="43" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Nerve nets → nerve cords</text><text x="168" y="60" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">first centralization of the nervous system</text><text x="132" y="103" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~560 Mya</text><circle cx="150" cy="99" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="97" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Vertebrate brain plan + basal ganglia</text><text x="168" y="114" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">the action-selection circuit, traced via the lamprey</text><text x="132" y="157" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~540 Mya</text><circle cx="150" cy="153" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="151" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Molluscan / annelid ganglia</text><text x="168" y="168" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">the lineage of Aplysia's learning circuits</text><text x="132" y="211" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~400 Mya</text><circle cx="150" cy="207" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="205" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Insect mushroom bodies</text><text x="168" y="222" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">dedicated learning centers (fly, bee)</text><text x="132" y="265" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~300 Mya</text><circle cx="150" cy="261" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="259" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Cephalopod complex brain</text><text x="168" y="276" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">the octopus's independently-evolved mind</text><text x="132" y="319" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~200 Mya</text><circle cx="150" cy="315" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="313" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Mammalian six-layer neocortex</text><text x="168" y="330" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">the layered cortex our own brain elaborates</text><text x="132" y="373" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~150 Mya</text><circle cx="150" cy="369" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="367" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Avian pallium (cortex-like, unlayered)</text><text x="168" y="384" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">the substrate corvid intelligence later exploits</text><text x="132" y="427" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~65 Mya</text><circle cx="150" cy="423" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="421" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Primate visual &amp; prefrontal expansion</text><text x="168" y="438" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">association cortex begins to enlarge</text><text x="132" y="481" text-anchor="end" class="datalabel tab" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif" font-size="10.5px">~2 Mya</text><circle cx="150" cy="477" r="5.5" fill="rgb(42, 120, 214)" stroke="rgb(252, 252, 251)" stroke-width="2"></circle><text x="168" y="475" class="datalabel" font-weight="600" font-size="10.5px" fill="rgb(82, 81, 78)" font-family="system-ui,sans-serif">Human association cortex &amp; language</text><text x="168" y="492" class="tick" fill="rgb(0, 0, 0)" font-family="system-ui,sans-serif" font-size="16px">cumulative culture and symbolic language</text></svg>